<style>
:root{--y:#F3BC41;--t:#469DB0;--tt:#2F7F92;--n:#1A1D23;--bg:#F4F6F8;--card:#fff;--tx:#1A1D23;--mu:#667085;--bd:#E4E7EC;color-scheme:light}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx)}
button{font-family:inherit}
.tri{display:flex;gap:6px;height:6px}
.tri i{display:block;border-radius:99px;height:100%}
.tri i:nth-child(1){background:var(--y);width:34%}
.tri i:nth-child(2){background:var(--t);width:34%}
.tri i:nth-child(3){background:var(--n);flex:1}
.app{display:block}
main{padding:0 12px 100px;min-width:0}
/* barra superior */
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;display:flex;gap:10px;align-items:center}
.mn{flex:none;border:0;background:var(--n);color:#fff;border-radius:12px;padding:12px 14px;font-size:15px;font-weight:600;cursor:pointer}
.mn b{color:var(--y)}
input.q{flex:1;min-width:0;padding:12px 14px;border-radius:12px;border:1.5px solid var(--bd);background:#fff;color:var(--tx);font-size:16px}
input.q:focus{outline:0;border-color:var(--t)}
/* hero */
.hero{background:#fff;border:1px solid var(--bd);border-radius:22px;overflow:hidden;margin:6px 0 14px;box-shadow:0 6px 22px #1a1d230d}
.hero .in{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:18px 18px 16px}
.hero img{width:170px;max-width:55%;height:auto;display:block}
.hero p{color:var(--mu);font-size:14px;line-height:1.4;max-width:420px}
.hero .ct{display:inline-block;background:var(--n);color:var(--y);font-weight:700;font-size:13px;padding:6px 14px;border-radius:99px;margin-top:4px}
.hero .ct:empty{display:none}
@media(min-width:700px){.hero .in{flex-direction:row;text-align:left;gap:26px;padding:22px 28px}.hero img{width:150px;max-width:none}}
#cnt{color:var(--mu);font-size:14px;margin:0 2px 10px;font-weight:500}
/* barra lateral */
#sb{position:fixed;top:0;left:0;bottom:0;width:84%;max-width:320px;background:var(--n);color:#fff;z-index:20;transform:translateX(-102%);transition:transform .22s;overflow-y:auto;padding:18px 14px 30px}
#sb.open{transform:none}
#ov{display:none;position:fixed;inset:0;background:#0009;z-index:15}
#ov.on{display:block}
.sbh{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sbh img{width:46px;height:46px;border-radius:12px;background:#fff;flex:none}
.sbh b{font-size:19px;display:block;line-height:1.1}
.sbh small{color:#ffffffa6;font-size:12px}
#sb h3{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--y);margin:20px 4px 6px}
.it{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;color:#fff;padding:11px 12px;border-radius:12px;font-size:15px;cursor:pointer}
.it:hover{background:#ffffff14}
.it span{font-size:12px;color:#fff;background:#ffffff26;border-radius:99px;padding:2px 9px;font-weight:600}
.it.on{background:var(--y);color:var(--n);font-weight:700}
.it.on span{background:#1a1d2326;color:var(--n)}
.it.clr{color:#ffffffb3;margin-top:16px;border:1px dashed #ffffff40;justify-content:center}
.ck{display:flex;align-items:center;gap:10px;padding:8px 12px;font-size:15px;cursor:pointer}
.ck input{width:20px;height:20px;accent-color:var(--y)}
#sb select{width:100%;padding:11px 12px;border-radius:12px;border:1px solid #ffffff33;background:#ffffff14;color:#fff;font-size:15px}
#sb select option{color:#111}
.cl{float:right;border:0;background:#ffffff1f;color:#fff;width:34px;height:34px;border-radius:50%;font-size:16px;cursor:pointer}
.sbf{margin-top:26px}
/* productos */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr);gap:16px}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;overflow:hidden;cursor:pointer;position:relative;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 26px #1a1d2318}
.card:active{transform:scale(.98)}
.card img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#eef1f4}
.card .in{padding:11px 13px 14px;border-top:3px solid var(--y)}
.card b{display:block;font-size:15px;line-height:1.25}
.pr{margin-top:5px;font-weight:800;color:var(--tt);font-size:16px}
.pr s{color:var(--mu);font-weight:400;font-size:13px;margin-right:6px}
.tag{position:absolute;top:10px;left:10px;background:var(--y);color:var(--n);font-size:11px;font-weight:800;letter-spacing:.04em;padding:4px 10px;border-radius:99px;box-shadow:0 2px 8px #0002}
.empty{text-align:center;color:var(--mu);padding:60px 16px}
.foot{margin-top:36px;text-align:center;color:var(--mu);font-size:13px}
.foot .tri{max-width:160px;margin:0 auto 10px}
@media(min-width:900px){
 .app{display:grid;grid-template-columns:280px 1fr}
 #sb{position:sticky;top:0;height:100vh;transform:none;width:auto;max-width:none;z-index:1}
 .mn,.cl,#ov{display:none!important}
 main{padding:0 24px 40px;max-width:1120px}
}
@media(min-width:1250px){.grid{grid-template-columns:repeat(4,1fr)}}
/* detalle */
#md{display:none;position:fixed;inset:0;background:#000b;z-index:30;align-items:flex-end;justify-content:center}
#md.on{display:flex}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:0 0 18px}
@media(min-width:700px){#md{align-items:center}.sheet{border-radius:24px}}
.sheet .main{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#eef1f4}
.th{display:flex;gap:8px;padding:10px 16px 0;overflow-x:auto}
.th img{width:60px;height:60px;object-fit:cover;border-radius:10px;border:2.5px solid transparent;cursor:pointer;flex:none}
.th img.on{border-color:var(--y)}
.body{padding:14px 18px 0}
.body h2{font-size:21px}
.body .pr{font-size:22px}
.body p{color:var(--mu);margin:8px 0;white-space:pre-line;line-height:1.5}
.vs{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.v{border:1.5px solid var(--bd);background:#fff;color:var(--tx);padding:8px 14px;border-radius:10px;font-size:14px;cursor:pointer}
.v.on{border-color:var(--n);background:var(--n);color:var(--y);font-weight:700}
.btn{display:block;text-align:center;text-decoration:none;background:#25D366;color:#fff;font-weight:800;padding:15px;border-radius:14px;margin-top:14px;font-size:16px;border:0;width:100%;cursor:pointer;box-shadow:0 6px 16px #25d36644}
.btn.g{background:#fff;color:var(--tx);border:1.5px solid var(--bd);margin-top:8px;box-shadow:none;font-weight:600}
.x{position:sticky;top:0;float:right;margin:10px;z-index:2;width:38px;height:38px;border-radius:50%;border:0;background:var(--n);color:var(--y);font-size:18px;cursor:pointer}
/* cómo pedir */
.how{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.st{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--bd);border-radius:12px;padding:8px 12px;font-size:13px;flex:1 1 150px}
.st i{flex:none;width:22px;height:22px;border-radius:50%;background:var(--y);color:var(--n);font-style:normal;font-weight:800;font-size:12px;display:grid;place-items:center}
.inf{display:flex;flex-direction:column;gap:6px;margin:12px 0 0;font-size:14px;color:var(--mu)}
.inf div{background:var(--bg);border-radius:10px;padding:8px 12px}
#infoTop{display:flex;flex-wrap:wrap;gap:8px;width:100%}
#infoTop div{background:#fff;border:1px dashed var(--t);border-radius:12px;padding:8px 12px;font-size:13px;flex:1 1 200px}
#infoTop:empty{display:none}
/* carrito */
#cartbar{display:none;position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:10;align-items:center;gap:14px;background:var(--n);color:#fff;border:0;border-radius:99px;padding:14px 22px;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 10px 28px #1a1d2366;min-width:250px;justify-content:space-between;font-family:inherit}
#cartbar b{color:var(--y)}
#cm{display:none;position:fixed;inset:0;background:#000b;z-index:31;align-items:flex-end;justify-content:center}
#cm.on{display:flex}
.ci{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}
.ci img{width:56px;height:56px;border-radius:12px;object-fit:cover;flex:none;background:#eef1f4}
.cm{flex:1;min-width:0}
.cm b{display:block;font-size:15px}
.cm small{display:block;color:var(--mu)}
.cm span{color:var(--tt);font-weight:700;font-size:14px}
.qt{display:flex;align-items:center;gap:8px;flex:none}
.qt button{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--bd);background:#fff;font-size:18px;cursor:pointer;color:var(--tx)}
.qt em{font-style:normal;font-weight:700;min-width:18px;text-align:center}
.tot{display:flex;justify-content:space-between;font-size:18px;padding:14px 0 4px}
.tot b{color:var(--tt)}
.fl{display:block;font-size:13px;color:var(--mu);margin-top:10px}
.fl input,.fl select,.fl textarea{display:block;width:100%;margin-top:4px;padding:11px 12px;border-radius:12px;border:1.5px solid var(--bd);background:#fff;color:var(--tx);font-size:16px;font-family:inherit}
.fl input:focus,.fl select:focus,.fl textarea:focus{outline:0;border-color:var(--t)}
.btn.y{background:var(--y);color:var(--n);box-shadow:0 6px 16px #f3bc4155}
.btn.w{background:#fff;color:#128C4A;border:1.5px solid #25D366;box-shadow:none}
.er{color:#c62828;font-size:13px;font-weight:600;margin:-2px 0 6px}
.mu{color:var(--mu);font-size:13px;margin-top:10px}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--n);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;font-weight:600;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
@media(min-width:700px){#cm{align-items:center}}
.cl2 a{display:block;color:#fff;text-decoration:none;padding:11px 12px;border-radius:12px;font-size:15px}
.cl2 a:hover{background:#ffffff14}
.foot a{color:var(--tt);font-weight:700;text-decoration:none;margin:0 10px;display:inline-block;padding:6px 0}
#ft{margin-bottom:6px}
.ph{width:100%;aspect-ratio:1;background:linear-gradient(90deg,#eef1f4,#f9fafb,#eef1f4);background-size:200% 100%;animation:sh 1.3s infinite linear}
@keyframes sh{to{background-position:-200% 0}}
.card.so img{filter:grayscale(.9);opacity:.55}
.tag.out{background:#667085;color:#fff}
.btn:disabled{opacity:.55;cursor:not-allowed;box-shadow:none}
/* información */
.info{background:#fff;border:1px solid var(--bd);border-radius:18px;padding:18px 18px 8px;margin-top:22px;scroll-margin-top:84px}
.info h2{font-size:19px;margin-bottom:10px;display:inline-block;border-bottom:4px solid var(--y);padding-bottom:2px}
.info p{color:var(--mu);line-height:1.55;margin:8px 0}
.info .ab{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0 10px}
.info .ab a{background:var(--n);color:var(--y);text-decoration:none;font-weight:700;padding:10px 16px;border-radius:99px;font-size:14px}
.info details{border-top:1px solid var(--bd)}
.info details:first-of-type{border-top:0}
.info summary{cursor:pointer;font-weight:700;padding:14px 0;list-style:none;display:flex;justify-content:space-between;gap:12px}
.info summary::-webkit-details-marker{display:none}
.info summary::after{content:'+';color:var(--tt);font-size:22px;line-height:1}
.info details[open] summary::after{content:'–'}
.info details p{margin:0 0 14px}
/* descuentos */
.sub{display:flex;justify-content:space-between;gap:10px;color:var(--mu);font-size:14px;padding:6px 0 0}
.sub.dc{color:#128C4A;font-weight:700}
.nt{background:#FFF7E0;border:1px solid var(--y);color:#7a5a00;border-radius:10px;padding:8px 12px;font-size:13px;margin-top:10px;font-weight:600}
.cp{display:flex;gap:8px;margin-top:12px}
.cp input{flex:1;min-width:0;padding:11px 12px;border-radius:12px;border:1.5px solid var(--bd);font-size:16px;text-transform:uppercase;background:#fff;color:var(--tx);font-family:inherit}
.cp input:focus{outline:0;border-color:var(--t)}
.cp button{background:var(--n);color:var(--y);border:0;border-radius:12px;padding:0 18px;font-weight:700;cursor:pointer;font-family:inherit}
</style>
</head>
<body>
<div class="app">

    <section class="how">
      <div class="st"><i>1</i>Elige tus productos</div>
      <div class="st"><i>2</i>Agrégalos a tu pedido</div>

    <section class="info" id="nosotros"><h2>Quiénes somos</h2><div id="aboutT"></div></section>
    <section class="info" id="faq"><h2>Preguntas frecuentes</h2><div id="faqL"></div></section>

</div>
<div id="md"><div class="sheet" id="sheet"></div></div>
<div id="cm"><div class="sheet" id="csheet"></div></div>
<button id="cartbar" aria-label="Ver mi pedido"></button>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* ====== DATOS DE ENTREGA Y PAGO (llena lo que aplique; lo vacío no se muestra) ====== */
const INFO={
  tiempo:'',   // ej. 'Tiempo de producción: 2 a 5 días hábiles'
  envios:'',   // ej. 'Envíos a todo México por paquetería'
  pagos:'',    // ej. 'Pagos por transferencia o efectivo'
  entrega:['Envío','Recoger en persona'],   // opciones que verá el cliente
  instagram:'12_tresd',                     // usuario de Instagram (vacío = no se muestra)
  about:'',        // texto de "Quiénes somos" (vacío = texto por defecto). Separa párrafos con una línea nueva
  faq:[],          // tus propias preguntas: [['¿Pregunta?','Respuesta'],['¿Otra?','Otra respuesta']] (vacío = las de por defecto)
  goatcounter:'',  // tu código de GoatCounter (ej. '12tresd') para contar visitas. Vacío = sin estadísticas
  descuentos:[],   // por cantidad de piezas. Ej: [{min:3,pct:10},{min:6,pct:15}] = 10% con 3+ piezas, 15% con 6+
  cupones:{}       // Ej: {'BIENVENIDO':{pct:10},'MENOS50':{monto:50,min:300,vence:'2026-12-31'}}
};
(function(){if(!INFO.goatcounter)return;const g=document.createElement('script');g.async=true;g.dataset.goatcounter='https://'+INFO.goatcounter+'.goatcounter.com/count';g.src='//gc.zgo.at/count.js';document.head.appendChild(g)})();
const track=(path,title)=>{try{window.goatcounter&&window.goatcounter.count&&window.goatcounter.count({path,title:title||path,event:true})}catch(e){}};
let D=null,cat='Todos',ctId=null,query='',sort='rel',deals=false;
const money=n=>(D.set.cur||'$')+Number(n).toFixed(2);
const imgs=p=>p.imgs?.length?p.imgs:(p.img?[p.img]:[]);
const cOf=p=>p.cat||'Sin categoría';
const now=p=>Number(p.sale||p.price);

async function init(){
  try{
    const r=await fetch('catalogo.json?v='+Date.now());
    if(!r.ok)throw 0;
    D=await r.json();
  }catch(e){
    $('#msg').textContent='No se pudo cargar el catálogo. Si abriste el archivo directo desde tu celular o computadora, súbelo a un hosting para verlo.';
    return;
  }
  D.set=D.set||{};D.p=D.p||[];D.c=D.c||[];
  ctId=D.c[0]?.id??null;
  loadCart();updBar();
  $('#infoTop').innerHTML=infoLines().map(t=>`<div>${esc(t)}</div>`).join('');
  const ct=contact();
  $('#sbf').innerHTML='<h3>Información</h3><button class="it" data-go="nosotros">Quiénes somos</button><button class="it" data-go="faq">Preguntas frecuentes</button>'+(ct?'<h3>Contacto</h3><div class="cl2">'+ct+'</div>':'');
  drawInfo();
  $('#ft').innerHTML=ct;
  draw();
  const dl=new URLSearchParams(location.search).get('p');if(dl)openP(dl);
  loadPhotos();
}

async function loadPhotos(){
  if(D.p.every(p=>p.imgs?.length||p.img))return;
  try{
    const r=await fetch('fotos.json?v='+(D.v||''));if(!r.ok)throw 0;
    const F=(await r.json()).f||{};
    D.p.forEach(p=>{if(F[p.id])p.imgs=F[p.id]});
    draw();updBar();
    if($('#md').classList.contains('on'))renderP();
    if($('#cm').classList.contains('on'))renderCart();
  }catch(e){}
}

function base(){
  const c=D.c.find(x=>x.id==ctId);
  return c?c.ids.map(id=>D.p.find(p=>p.id==id)).filter(Boolean):D.p;
}

function side(b){
  let h='';
  if(D.c.length>1)h+='<h3>Catálogos</h3>'+D.c.map(c=>`<button class="it ${c.id==ctId?'on':''}" data-ct="${esc(c.id)}">${esc(c.title)}</button>`).join('');
  const cs=[...new Set(b.map(cOf))];
  h+=`<h3>Categorías</h3><button class="it ${cat=='Todos'?'on':''}" data-cat="Todos">Todos<span>${b.length}</span></button>`
    +cs.map(c=>`<button class="it ${c==cat?'on':''}" data-cat="${esc(c)}">${esc(c)}<span>${b.filter(p=>cOf(p)==c).length}</span></button>`).join('');
  const nd=b.filter(p=>p.sale).length;
  if(nd)h+=`<h3>Filtrar</h3><label class="ck"><input type="checkbox" id="of" ${deals?'checked':''}> Solo ofertas (${nd})</label>`;
  h+=`<h3>Ordenar por</h3><select id="so">${[['rel','Orden del catálogo'],['lo','Precio: menor a mayor'],['hi','Precio: mayor a menor'],['az','Nombre A–Z']].map(([v,t])=>`<option value="${v}" ${sort==v?'selected':''}>${t}</option>`).join('')}</select>`;
  h+='<button class="it clr" data-clr="1">Limpiar filtros</button>';
  $('#sbc').innerHTML=h;
}

function draw(){
  const b=base();
  if(cat!='Todos'&&!b.some(p=>cOf(p)==cat))cat='Todos';
  side(b);
  $('#sub').textContent=D.c.find(x=>x.id==ctId)?.title||'';
  const q=query.trim().toLowerCase();
  let ps=b.filter(p=>(cat=='Todos'||cOf(p)==cat)&&(!deals||p.sale)&&(!q||(p.name+' '+(p.desc||'')+' '+(p.vars||[]).join(' ')).toLowerCase().includes(q)));
  if(sort=='lo')ps=[...ps].sort((a,c)=>now(a)-now(c));
  else if(sort=='hi')ps=[...ps].sort((a,c)=>now(c)-now(a));
  else if(sort=='az')ps=[...ps].sort((a,c)=>a.name.localeCompare(c.name,'es'));
  $('#cnt').textContent=ps.length+(ps.length==1?' producto':' productos')+(cat!='Todos'?' en '+cat:'');
  $('#grid').innerHTML=ps.map(p=>`<div class="card ${p.out?'so':''}" data-p="${esc(p.id)}">${p.out?'<span class="tag out">AGOTADO</span>':p.sale?'<span class="tag">OFERTA</span>':''}${imgs(p)[0]?`<img loading="lazy" decoding="async" src="${imgs(p)[0]}" alt="${esc(p.name)}">`:'<div class="ph"></div>'}<div class="in"><b>${esc(p.name)}</b><div class="pr">${p.sale?`<s>${money(p.price)}</s>${money(p.sale)}`:money(p.price)}</div></div></div>`).join('');
  $('#msg').style.display=ps.length?'none':'block';
  $('#msg').textContent=b.length?'No hay productos con esos filtros.':'Aún no hay productos publicados.';
}

/* menú */
const openSB=()=>{$('#sb').classList.add('open');$('#ov').classList.add('on')};
const closeSB=()=>{$('#sb').classList.remove('open');$('#ov').classList.remove('on')};
$('#mn').onclick=openSB;$('#cl').onclick=closeSB;$('#ov').onclick=closeSB;
$('#sbc').addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.ct!==undefined){ctId=D.c.find(c=>String(c.id)==t.dataset.ct)?.id;cat='Todos'}
  else if(t.dataset.cat!==undefined){cat=t.dataset.cat}
  else if(t.dataset.clr){cat='Todos';deals=false;sort='rel';query='';$('#q').value=''}
  else return;
  draw();closeSB();window.scrollTo({top:0,behavior:'smooth'});
});
$('#sbc').addEventListener('change',e=>{
  if(e.target.id=='of'){deals=e.target.checked;draw()}
  if(e.target.id=='so'){sort=e.target.value;draw()}
});
$('#sbf').addEventListener('click',e=>{const t=e.target.closest('button');if(!t||!t.dataset.go)return;closeSB();setTimeout(()=>{const el=document.getElementById(t.dataset.go);if(el)el.scrollIntoView({behavior:'smooth'})},180)});
$('#q').addEventListener('input',e=>{query=e.target.value;draw()});
$('#grid').addEventListener('click',e=>{const c=e.target.closest('.card');if(c)openP(c.dataset.p)});

/* producto */
let sel={};
function openP(id){
  const p=D.p.find(x=>String(x.id)==id);if(!p)return;
  sel={p,v:null,i:0};renderP();track('producto/'+p.name,'Vio: '+p.name);
  $('#md').classList.add('on');document.body.style.overflow='hidden';
}
function renderP(){
  const {p,v,i}=sel,im=imgs(p);
  const tel=String(D.set.tel||'').replace(/\D/g,'');
  const num=tel.length==10?'52'+tel:tel;
  const txt=p.out?`Hola, ¿cuándo tendrán disponible: ${p.name}?`:`Hola, me interesa: ${p.name}${v?' ('+v+')':''} — ${money(p.sale||p.price)}`;
  $('#sheet').innerHTML=`<button class="x" onclick="closeP()">✕</button>
  ${im[i]?`<img class="main" id="mainimg" src="${im[i]}" alt="${esc(p.name)}">`:'<div class="ph main"></div>'}
  ${im.length>1?`<div class="th">${im.map((x,k)=>`<img class="${k==i?'on':''}" src="${x}" onclick="sel.i=${k};renderP()">`).join('')}</div>`:''}
  <div class="body"><h2>${esc(p.name)}</h2>
  <div class="pr">${p.sale?`<s>${money(p.price)}</s>${money(p.sale)}`:money(p.price)}</div>
  ${p.desc?.trim()?`<p>${esc(p.desc)}</p>`:''}
  ${p.vars?.length?`<div class="vs">${p.vars.map(x=>`<button class="v ${x==v?'on':''}" data-v="${esc(x)}" onclick="sel.v=sel.v==this.dataset.v?null:this.dataset.v;sel.err=false;renderP()">${esc(x)}</button>`).join('')}</div>${sel.err&&!v?'<div class="er">Elige una opción para continuar</div>':''}`:''}
  ${p.out?'<button class="btn y" disabled>Agotado por ahora</button>':'<button class="btn y" onclick="addFromModal()">Agregar al pedido</button>'}
  ${num?`<a class="btn w" target="_blank" rel="noopener" href="https://wa.me/${num}?text=${encodeURIComponent(txt)}">${p.out?'Preguntar por disponibilidad':'Pedir solo este por WhatsApp'}</a>`:''}
  <button class="btn g" onclick="shareP()">Compartir este producto</button>
  <button class="btn g" onclick="closeP()">Seguir viendo</button></div>`;
}
/* ====== PEDIDO ====== */
const KEY='12td_cart';
let cart=[],ord={name:'',ent:INFO.entrega[0]||'',note:'',coupon:'',cpIn:'',cpm:''};
const waNum=()=>{const t=String(D.set.tel||'').replace(/\D/g,'');return t.length==10?'52'+t:t};
const infoLines=()=>[INFO.tiempo&&'⏱ '+INFO.tiempo,INFO.envios&&'🚚 '+INFO.envios,INFO.pagos&&'💳 '+INFO.pagos,INFO.descuentos.length&&'🏷 Descuentos: '+[...INFO.descuentos].sort((a,c)=>a.min-c.min).map(d=>d.min+'+ piezas: '+d.pct+'%').join(' · ')].filter(Boolean);
function loadCart(){try{cart=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){cart=[]}
  cart=(Array.isArray(cart)?cart:[]).filter(i=>i&&i.q>0&&D.p.some(p=>String(p.id)==String(i.id)&&!p.out));
  try{ord.coupon=localStorage.getItem(KEY+'_cp')||'';ord.cpIn=ord.coupon}catch(e){}}
function saveCart(){try{localStorage.setItem(KEY,JSON.stringify(cart));localStorage.setItem(KEY+'_cp',ord.coupon||'')}catch(e){}}
const lines=()=>cart.map(i=>{const p=D.p.find(x=>String(x.id)==String(i.id));return{...i,p,pr:now(p)}});
const subtotal=()=>lines().reduce((a,l)=>a+l.pr*l.q,0);
const CUP=Object.fromEntries(Object.entries(INFO.cupones).map(([k,v])=>[k.trim().toUpperCase(),v]));
function couponCheck(code){code=(code||'').trim().toUpperCase();if(!code)return{ok:false,msg:''};const d=CUP[code];
  if(!d)return{ok:false,msg:'Ese código no es válido.'};
  if(d.vence&&new Date(d.vence+'T23:59:59')<new Date())return{ok:false,msg:'Ese cupón ya venció.'};
  if(d.min&&subtotal()<d.min)return{ok:false,msg:'Este cupón aplica en compras desde '+money(d.min)+'.'};
  return{ok:true,code,d}}
function disc(){const sub=subtotal(),n=count();let b={amt:0,label:''};
  const t=[...INFO.descuentos].sort((a,c)=>c.min-a.min).find(x=>n>=x.min);
  if(t){const a=sub*t.pct/100;if(a>b.amt)b={amt:a,label:`${t.pct}% por llevar ${t.min} o más piezas`}}
  const c=couponCheck(ord.coupon);
  if(c.ok){const a=c.d.pct?sub*c.d.pct/100:Math.min(c.d.monto||0,sub);if(a>b.amt)b={amt:a,label:'Cupón '+c.code}}
  b.amt=Math.round(b.amt*100)/100;return b}
const total=()=>Math.max(0,Math.round((subtotal()-disc().amt)*100)/100);
function nextTier(){const n=count(),t=[...INFO.descuentos].sort((a,c)=>a.min-c.min).find(x=>x.min>n);return t?{faltan:t.min-n,pct:t.pct}:null}
const cpMsg=()=>{if(ord.coupon){const c=couponCheck(ord.coupon);return c.ok?'Cupón aplicado ✓':c.msg}return ord.cpm||''};
const count=()=>cart.reduce((a,i)=>a+i.q,0);
function addCart(id,v){const k=cart.find(i=>String(i.id)==String(id)&&(i.v||'')==(v||''));k?k.q++:cart.push({id,v:v||'',q:1});saveCart();updBar()}
function updBar(){const n=count(),b=$('#cartbar');b.style.display=n?'flex':'none';b.innerHTML=`<span>🛒 Mi pedido (${n})</span><b>${money(total())}</b>`}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1700)}
function addFromModal(){const {p,v}=sel;if(p.out)return;if(p.vars?.length&&!v){sel.err=true;renderP();return}addCart(p.id,v);track('agregar/'+p.name,'Agregó: '+p.name);closeP();toast('Agregado a tu pedido ✓')}
function orderText(){const L=lines();
  return 'Hola, quiero hacer este pedido:\n'+L.map(l=>`• ${l.q} × ${l.p.name}${l.v?' ('+l.v+')':''} — ${money(l.pr*l.q)}`).join('\n')
   +`\n\n`+(disc().amt?`Subtotal: ${money(subtotal())}\nDescuento (${disc().label}): -${money(disc().amt)}\n`:'')+`Total: ${money(total())}`+(ord.ent?`\nEntrega: ${ord.ent}`:'')+(ord.name.trim()?`\nNombre: ${ord.name.trim()}`:'')+(ord.note.trim()?`\nNotas: ${ord.note.trim()}`:'')}
function renderCart(){
  const L=lines(),num=waNum();
  $('#csheet').innerHTML=`<button class="x" data-cart="close">✕</button><div class="body"><h2>Tu pedido</h2>
  ${L.length?L.map((l,k)=>`<div class="ci">${imgs(l.p)[0]?`<img src="${imgs(l.p)[0]}" alt="">`:'<div class="ph" style="width:56px;height:56px;border-radius:12px;flex:none"></div>'}<div class="cm"><b>${esc(l.p.name)}</b>${l.v?`<small>${esc(l.v)}</small>`:''}<span>${money(l.pr)}</span></div><div class="qt"><button data-q="${k}" data-d="-1" aria-label="Quitar uno">−</button><em>${l.q}</em><button data-q="${k}" data-d="1" aria-label="Agregar uno">+</button></div></div>`).join(''):'<div class="empty" style="padding:30px 0">Tu pedido está vacío.</div>'}
  ${L.length?`${disc().amt?`<div class="sub"><span>Subtotal</span><span>${money(subtotal())}</span></div><div class="sub dc"><span>${esc(disc().label)}</span><span>−${money(disc().amt)}</span></div>`:''}${nextTier()?`<div class="nt">🏷 Agrega ${nextTier().faltan} pieza${nextTier().faltan>1?'s':''} más y obtén ${nextTier().pct}% de descuento</div>`:''}<div class="tot"><span>Total</span><b>${money(total())}</b></div>
  ${Object.keys(CUP).length?`<div class="cp"><input id="cpn" placeholder="Código de descuento" value="${esc(ord.cpIn)}" autocapitalize="characters" autocomplete="off"><button data-cart="coupon">Aplicar</button></div>${cpMsg()?`<div class="mu" style="margin-top:6px">${esc(cpMsg())}</div>`:''}`:''}
  <label class="fl">Tu nombre (opcional)<input id="on" value="${esc(ord.name)}" maxlength="60" autocomplete="name"></label>
  ${INFO.entrega.length?`<label class="fl">¿Cómo lo quieres recibir?<select id="oe">${INFO.entrega.map(e=>`<option ${e==ord.ent?'selected':''}>${esc(e)}</option>`).join('')}</select></label>`:''}
  <label class="fl">Notas o personalización<textarea id="ono" rows="3" maxlength="400" placeholder="Ej. nombre a grabar, color, tamaño…">${esc(ord.note)}</textarea></label>
  ${infoLines().length?`<div class="inf">${infoLines().map(t=>`<div>${esc(t)}</div>`).join('')}</div>`:''}
  ${num?`<button class="btn" data-cart="send">Enviar pedido por WhatsApp</button><p class="mu">Se abrirá WhatsApp con tu pedido listo. Ahí confirmamos tiempo, entrega y pago.</p>`:'<p class="mu">Aún no hay número de WhatsApp configurado.</p>'}
  <button class="btn g" data-cart="clear">Vaciar pedido</button>`:''}
  <button class="btn g" data-cart="close">Seguir viendo</button></div>`;
}
function openCart(){renderCart();$('#cm').classList.add('on');document.body.style.overflow='hidden'}
function closeCart(){$('#cm').classList.remove('on');document.body.style.overflow=''}
$('#cartbar').addEventListener('click',openCart);
$('#cm').addEventListener('click',e=>{if(e.target.id=='cm')return closeCart();
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.q!==undefined){const i=+t.dataset.q,l=cart[i];if(l){l.q+=+t.dataset.d;if(l.q<=0)cart.splice(i,1);if(l.q>99)l.q=99;saveCart();updBar();cart.length?renderCart():closeCart()}}
  else if(t.dataset.cart=='close')closeCart();
  else if(t.dataset.cart=='clear'){if(confirm('¿Vaciar tu pedido?')){cart=[];saveCart();updBar();closeCart()}}
  else if(t.dataset.cart=='coupon'){const c=couponCheck(ord.cpIn);ord.coupon=c.ok?c.code:'';ord.cpm=c.ok?'':(c.msg||'Escribe tu código.');saveCart();updBar();renderCart()}
  else if(t.dataset.cart=='send'){track('pedido-enviado','Pedido enviado por WhatsApp');window.open('https://wa.me/'+waNum()+'?text='+encodeURIComponent(orderText()),'_blank')}
});
$('#cm').addEventListener('input',e=>{if(e.target.id=='cpn')ord.cpIn=e.target.value;if(e.target.id=='on')ord.name=e.target.value;if(e.target.id=='ono')ord.note=e.target.value});
$('#cm').addEventListener('change',e=>{if(e.target.id=='oe')ord.ent=e.target.value});
const aboutText=()=>INFO.about.trim()||'En 12 Tres D! creamos productos impresos en 3D, personalizados y hechos bajo pedido.\nTus ideas toman forma: cuéntanos lo que imaginas y lo hacemos realidad.';
function faqList(){
  if(INFO.faq.length)return INFO.faq;
  const f=[
   ['¿Cómo hago un pedido?','Elige tus productos, agrégalos a tu pedido y toca "Enviar pedido por WhatsApp". Se abrirá WhatsApp con tu lista lista para enviar y ahí confirmamos todo contigo.'],
   ['¿Puedo personalizar un producto?','Sí. Trabajamos productos personalizados y hechos bajo pedido. Escribe lo que necesitas (nombre, color, tamaño) en las notas de tu pedido.'],
   ['¿Cuánto tarda mi pedido?',INFO.tiempo||'Al ser productos hechos bajo pedido, el tiempo depende del producto. Te lo confirmamos por WhatsApp antes de empezar.'],
   ['¿Hacen envíos?',INFO.envios||(INFO.entrega.length?'Al hacer tu pedido puedes elegir: '+INFO.entrega.join(' o ').toLowerCase()+'. Confirmamos los detalles contigo por WhatsApp.':'Confirmamos los detalles de entrega contigo por WhatsApp.')],
   ['¿Cómo puedo pagar?',INFO.pagos||'Te compartimos las opciones de pago por WhatsApp al confirmar tu pedido.'],
   ['¿Y si un producto está agotado?','Escríbenos con el botón "Preguntar por disponibilidad" y te avisamos cuándo lo tendremos.']];
  if(INFO.descuentos.length)f.push(['¿Hay descuentos?','Sí: '+[...INFO.descuentos].sort((a,c)=>a.min-c.min).map(d=>`${d.pct}% al llevar ${d.min} o más piezas`).join(', ')+'. Se aplica solo en tu pedido.']);
  if(Object.keys(INFO.cupones).length)f.push(['¿Cómo uso un cupón?','Escribe tu código en la parte de abajo de tu pedido y toca "Aplicar". Verás el descuento antes de enviarlo.']);
  return f}
function drawInfo(){
  $('#aboutT').innerHTML=aboutText().split(/\n+/).map(t=>`<p>${esc(t)}</p>`).join('')+(contact()?`<div class="ab">${contact()}</div>`:'');
  $('#faqL').innerHTML=faqList().map(([q,a])=>`<details><summary>${esc(q)}</summary><p>${esc(a)}</p></details>`).join('')}
function contact(){const n=waNum(),ig=INFO.instagram;
  return [n&&`<a href="https://wa.me/${n}?text=${encodeURIComponent('Hola, vi su catálogo y tengo una pregunta')}" target="_blank" rel="noopener">💬 WhatsApp</a>`,ig&&`<a href="https://instagram.com/${esc(ig)}" target="_blank" rel="noopener">📷 @${esc(ig)}</a>`].filter(Boolean).join('')}
function shareP(){const p=sel.p;track('compartir/'+p.name,'Compartió: '+p.name);const u=location.origin+location.pathname+'?p='+encodeURIComponent(p.id);
  if(navigator.share)navigator.share({title:p.name,text:p.name+' — '+money(p.sale||p.price),url:u}).catch(()=>{});
  else if(navigator.clipboard)navigator.clipboard.writeText(u).then(()=>toast('Enlace copiado ✓'),()=>prompt('Copia este enlace:',u));
  else prompt('Copia este enlace:',u)}
function closeP(){$('#md').classList.remove('on');document.body.style.overflow=''}
$('#md').addEventListener('click',e=>{if(e.target.id=='md')closeP()});
let tx=null;
$('#sheet').addEventListener('touchstart',e=>{tx=e.target.id=='mainimg'?e.touches[0].clientX:null},{passive:true});
$('#sheet').addEventListener('touchend',e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;tx=null;const n=imgs(sel.p).length;if(Math.abs(dx)>45&&n>1){sel.i=(sel.i+(dx<0?1:-1)+n)%n;renderP()}});
init();
</script>
</body>
</html>
