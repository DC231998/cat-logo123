<!DOCTYPE html>
<html lang="es"><head>
<meta name="robots" content="noindex,nofollow"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Catálogos</title>
<style>
:root{--bg:#111317;--card:#1A1D23;--bd:#30343c;--pri:#F3BC41;--sec:#469DB0;--onpri:#0b1120;--navbg:#1A1D23ee;--tx:#e8edf7;--mut:#9aa3b2;--ok:#66c37f;--wr:#f0b04a}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,sans-serif;padding:env(safe-area-inset-top) 0 120px}
#app{max-width:640px;margin:auto;padding:16px}
h1{font-size:32px}h2{font-size:22px}small{color:var(--mut)}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}.top h2{flex:1}
.ib,.fab{border:0;background:var(--card);color:var(--tx);width:44px;height:44px;border-radius:50%;font-size:20px}
.fab{position:fixed;right:20px;bottom:110px;width:60px;height:60px;border-radius:20px;background:var(--pri);color:var(--onpri);font-size:30px}
input,textarea,select{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:16px;padding:14px;color:var(--tx);font:inherit;margin-bottom:10px}
.search{border-radius:28px;padding-left:20px}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px}
.chip{flex:none;border:1px solid var(--bd);background:none;color:var(--tx);border-radius:24px;padding:10px 18px;font:inherit}
.chip.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:24px;overflow:hidden}
.card img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.card .in{padding:12px}
.tag{display:inline-block;background:var(--bg);color:var(--mut);border-radius:12px;padding:3px 10px;font-size:13px;margin:6px 0}
.pr{color:var(--pri);font-weight:700;font-size:18px}.pr s{color:var(--mut);font-size:13px;font-weight:400}
.act{display:flex;gap:6px;margin-top:8px}.act button{flex:1;border:0;border-radius:10px;padding:6px 2px;font-size:13px;background:var(--bg);color:var(--mut)}
.sec{background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:16px;margin-bottom:14px}
.sec>b{display:block;margin-bottom:10px;color:var(--mut);font-size:14px}
.drop{border:2px dashed var(--bd);border-radius:20px;min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--mut);overflow:hidden;text-align:center}
.drop img{width:100%;max-height:260px;object-fit:cover}
.row{display:flex;gap:10px}
.btn,.btn2{border:0;border-radius:20px;padding:16px;font:inherit;font-weight:700;width:100%;background:var(--pri);color:var(--onpri)}
.btn2{background:none;border:1px solid var(--bd);color:var(--tx)}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%);display:flex;gap:10px;max-width:640px;margin:auto}
#nav{position:fixed;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));max-width:612px;margin:auto;background:var(--navbg);backdrop-filter:blur(14px);border-radius:32px;padding:8px;display:flex;justify-content:space-around}
#nav button{border:0;background:none;font-size:22px;padding:12px 16px;border-radius:26px;filter:grayscale(1) opacity(.6)}
#nav button.on{background:var(--pri);filter:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:16px;text-align:center}
.stat b{display:block;font-size:30px;color:var(--pri)}
.hero{background:linear-gradient(135deg,#4c78c9,#7fb0f5);margin:-16px -16px 16px;padding:28px 20px 24px;border-radius:0 0 36px 36px}
.hero small{color:#dbe8ff}
.pill{font-size:12px;border-radius:12px;padding:3px 10px;font-weight:700}
.pub{background:#183a24;color:var(--ok)}.drf{background:#3a2c12;color:var(--wr)}
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--bd)}
.li img{width:52px;height:52px;border-radius:12px;object-fit:cover}.li div{flex:1}
.li input{width:22px;height:22px;margin:0}
.vars{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.vars span{background:var(--bg);border-radius:12px;padding:5px 12px}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
/* Vista previa / PDF */
#pages{padding-bottom:70px}
.pg{background:#fff;color:#222;border-radius:24px;padding:22px;margin:0 0 16px;min-height:75vh;display:flex;flex-direction:column;font-family:Georgia,serif}
.hd{font-size:20px;border-bottom:1px solid #ddd;padding-bottom:8px;margin-bottom:16px}
.gr{display:grid;grid-template-columns:1fr 1fr;gap:16px;flex:1;align-content:start}
.it img{width:100%;aspect-ratio:1;object-fit:cover;display:block;margin-bottom:6px}
.it b{display:block}.it small{display:block;color:#666}.it em{font-style:normal;color:var(--ac,#1e88e5);font-weight:700;font-size:18px}
.ft{display:flex;justify-content:space-between;border-top:1px solid #ddd;padding-top:8px;margin-top:16px;font-size:12px;color:#666}
.cover{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:12px}
.cover h1{font-size:44px}.cover h2{font-weight:400;color:#555}
.cimg{width:100%;aspect-ratio:1;object-fit:cover;margin-bottom:14px}
.it{position:relative}
.sl{display:none;position:absolute;top:8px;left:8px;z-index:1;background:var(--ac);color:#fff;font:700 11px system-ui;padding:3px 8px;border-radius:6px}
.t-price .sl{display:block}
:is(.t-neon,.t-street,.t-lujo,.t-electronics){color:#eee}
:is(.t-neon,.t-street,.t-lujo,.t-electronics) :is(.hd,.ft){border-color:#333;color:#aaa}
:is(.t-neon,.t-street,.t-lujo,.t-electronics) small{color:#aaa}
.t-neon{background:#0a0a12;font-family:system-ui,sans-serif}.t-neon .it{border:1px solid #7c3aed;padding:8px;border-radius:6px}.t-neon .it b{text-transform:uppercase;font-size:13px}.t-neon .it em{border:1px solid var(--ac);padding:2px 8px;display:inline-block;margin-top:4px;color:var(--ac)}
.t-street{background:#000;font-family:Impact,system-ui,sans-serif}.t-street .gr{grid-template-columns:1fr}.t-street .it{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;border:1px solid #fff;padding:8px;align-content:center}.t-street .it img{grid-row:span 4;margin:0}.t-street .it b{text-transform:uppercase;font-size:20px}.t-street .it em{color:var(--ac);font-size:22px}
.t-botanical{background:#fbf7f0}.t-botanical .it{background:#fff;border-radius:14px;padding:10px;box-shadow:0 2px 8px #0001}.t-botanical .it img{border-radius:10px}
.t-price{background:#fff8e1;font-family:system-ui,sans-serif}.t-price .it{background:#fff;border-radius:12px;padding:8px}.t-price .hd{color:var(--ac)}
.t-market{background:#f1f8ec;font-family:system-ui,sans-serif}.t-market .gr{grid-template-columns:repeat(3,1fr);gap:8px}.t-market .it{background:#e2f1d9;border-radius:12px;padding:6px;font-size:12px}.t-market .it small{display:none}.t-market .it em{font-size:14px}
.t-menu{font-family:system-ui,sans-serif}.t-menu .gr{grid-template-columns:1fr;gap:0}.t-menu .it{display:grid;grid-template-columns:56px 1fr auto;gap:0 12px;align-items:center;padding:8px 0;border-bottom:1px solid #eee}.t-menu .it img{grid-row:1/4;margin:0;border-radius:8px}.t-menu .it>:not(img):not(em):not(.sl){grid-column:2}.t-menu .it em{grid-column:3;grid-row:1/4}
.t-lujo{background:#0d0d0d}.t-lujo .gr{grid-template-columns:1fr}.t-lujo .it img{aspect-ratio:16/10}.t-lujo :is(.it b,.it em,.hd){color:var(--ac);text-transform:uppercase;letter-spacing:.12em}
.t-rose{background:#fbeef0}.t-rose .it{text-align:center}.t-rose .it img{aspect-ratio:4/5;border-radius:20px}
.t-tech .gr{grid-template-columns:1fr}.t-tech .it{display:grid;grid-template-columns:100px 1fr;gap:2px 14px;border:1px solid #ddd;padding:10px;font-family:system-ui,sans-serif}.t-tech .it img{grid-row:span 4;margin:0}.t-tech .it b{text-transform:uppercase;font-size:14px}.t-tech .it em{background:#111;color:#fff;padding:2px 10px;justify-self:start}
.t-electronics{background:#0b1730;font-family:system-ui,sans-serif}.t-electronics .gr{grid-template-columns:1fr}.t-electronics .it{display:grid;grid-template-columns:1fr 1.2fr;gap:2px 14px;align-items:center;background:#122246;border-radius:12px;padding:10px}.t-electronics .it img{grid-row:span 4;margin:0;border-radius:8px}.t-electronics .it b{text-transform:uppercase}
.gr{min-height:0}
.t-street .it img,.t-electronics .it img{height:40mm;aspect-ratio:auto}
.pt button.st{right:auto;left:4px}
#crop{display:none;position:fixed;inset:0;background:var(--bg);z-index:99;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;overflow:auto}
#crop canvas{width:min(88vw,400px);height:min(88vw,400px);border-radius:16px;touch-action:none}
#crop .cw{display:flex;gap:10px;width:min(88vw,400px)}#crop .btn,#crop .btn2{padding:12px}
.ph{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}.pt{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--bg)}.pt img{width:100%;height:100%;object-fit:cover;display:block}.pt button{position:absolute;top:4px;right:4px;width:26px;height:26px;border:0;border-radius:50%;background:#000a;color:#fff}.pt i{position:absolute;bottom:0;left:0;right:0;background:var(--pri);color:#0b1120;font:700 11px system-ui;text-align:center;padding:2px}.pt.add{display:flex;align-items:center;justify-content:center;border:2px dashed var(--bd);font-size:32px;color:var(--mut)}
.cnt{position:absolute;top:8px;right:8px;background:#000a;border-radius:10px;padding:2px 8px;font-size:12px}
.gal{display:flex;gap:4px;margin-bottom:6px}.pg .it .gal img{width:0;flex:1;height:14mm!important;aspect-ratio:auto!important;margin:0;border-radius:4px;object-fit:cover}
:is(.t-menu,.t-minimal,.t-tech,.t-street,.t-electronics) .gal{grid-column:1/-1}
.th{aspect-ratio:3/4;overflow:hidden;position:relative}
.th .pg{position:absolute;top:0;left:0;width:520px;height:693px;min-height:0;margin:0;border-radius:0;transform-origin:0 0;pointer-events:none}
.tc{background:var(--card);border:2px solid var(--bd);border-radius:24px;overflow:hidden;position:relative}.tc.on{border-color:var(--pri)}
.tc b{display:block;padding:10px 14px}
.tc.on:after{content:"✓";position:absolute;top:8px;right:8px;background:var(--pri);color:var(--onpri);width:28px;height:28px;border-radius:50%;text-align:center;line-height:28px;font-weight:700}
.t-moderna{background:#0f172a;color:#e8edf7;font-family:system-ui,sans-serif}
.t-moderna .hd{color:var(--ac);border-color:#334}
.t-moderna .it{background:#1a2440;border-radius:16px;padding:10px}.t-moderna .it img{border-radius:12px}
.t-moderna .it small,.t-moderna .ft,.t-moderna .cover h2{color:#9aa7c7}.t-moderna .ft{border-color:#334}
.t-minimal{font-family:system-ui,sans-serif;font-weight:300}
.t-minimal .hd{border:0;font-size:14px;letter-spacing:.15em;color:#999}
.t-minimal .gr{grid-template-columns:1fr;gap:18px}
.t-minimal .it{display:grid;grid-template-columns:110px 1fr;gap:2px 16px;align-items:center;border-bottom:1px solid #eee;padding-bottom:14px}
.t-minimal .it img{grid-row:span 4;margin:0}.t-minimal .it b{font-weight:600}
.t-revista{background:#f6f1e7;font-family:Georgia,serif}
.t-revista .hd{text-align:center;letter-spacing:.25em;color:var(--ac);border-color:var(--ac);text-transform:uppercase;font-size:15px}
.t-revista .it img{aspect-ratio:4/5}.t-revista .it b{font-size:18px}
.t-color .hd{background:var(--ac);color:#fff;padding:12px 16px;border:0;border-radius:14px}
.t-color .it{border:2px solid var(--ac);border-radius:16px;padding:10px}.t-color .it img{border-radius:10px}
.t-color .cover{background:var(--ac);color:#fff;border-radius:20px}.t-color .cover h2{color:#fff}
@media print{
 @page{margin:10mm}
 body{background:#fff;padding:0}#app{padding:0;max-width:none}
 #nav,.top,.bar{display:none!important}
 #pages{padding:0}
 .pg{width:100%;height:auto;min-height:0;border-radius:0;margin:0;padding:6mm 4mm;break-after:page;page-break-after:always;break-inside:avoid;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .pg:last-child{break-after:auto;page-break-after:auto}
 .cover{padding:15mm 0}
 .it{break-inside:avoid}
 :is(.t-clasica,.t-moderna,.t-botanical,.t-price,.t-revista,.t-color,.t-rose,.t-neon,.t-market,.t-lujo) .it img{height:auto;max-height:max(18mm,calc((170mm - var(--rows,2)*(30mm + var(--x,0mm)))/var(--rows,2)))}
 .cimg{aspect-ratio:auto!important;height:70mm}
 .t-minimal .it{grid-template-columns:22mm 1fr;padding-bottom:2mm}.t-tech .it{grid-template-columns:22mm 1fr;padding:2mm 3mm}
 .t-minimal .gr,.t-tech .gr{gap:2mm}
 .t-street .it img,.t-electronics .it img{height:32mm;aspect-ratio:auto!important}
}

.storageMeter{margin-top:10px}.storageTrack{height:12px;background:var(--bg);border:1px solid var(--bd);border-radius:999px;overflow:hidden}.storageFill{height:100%;width:0;background:var(--ok);border-radius:999px;transition:width .35s ease}.storageFill.warn{background:var(--wr)}.storageFill.danger{background:#ef6b73}.storageTop{display:flex;justify-content:space-between;gap:10px;align-items:center}.storageTop b{font-size:15px}.storageMeta{display:flex;justify-content:space-between;gap:10px;margin-top:7px}
.pw{-webkit-text-security:disc}
</style></head>
<body>
<div id="app"></div>
<nav id="nav">
<button data-t="home" onclick="go('home')">🏠</button>
<button data-t="prods" onclick="go('prods')">📦</button>
<button data-t="cats" onclick="go('cats')">📖</button>
<button data-t="orders" onclick="go('orders')">🧾</button>
<button data-t="sets" onclick="go('sets')">⚙️</button>
</nav>
<script>
const $=s=>document.querySelector(s);
const DEFAULT_STATE={p:[],c:[],cats:['General'],set:{brand:'Mi Negocio',tel:'',cur:'$'}};
let S=JSON.parse(localStorage.getItem('catalogos')||'null')||structuredClone(DEFAULT_STATE);
let DB=null, dbReady=null, saveTimer=null, storageTimer=null;
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open('123D_Catalogo_Local',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('state'))r.result.createObjectStore('state');};r.onsuccess=()=>{DB=r.result;resolve(DB)};r.onerror=()=>reject(r.error||new Error('IndexedDB unavailable'))})}
function idbGet(){return new Promise((resolve,reject)=>{const q=DB.transaction('state','readonly').objectStore('state').get('catalogos');q.onsuccess=()=>resolve(q.result||null);q.onerror=()=>reject(q.error)})}
function idbPut(data){return new Promise((resolve,reject)=>{const q=DB.transaction('state','readwrite').objectStore('state').put(data,'catalogos');q.onsuccess=()=>resolve();q.onerror=()=>reject(q.error)})}
async function initStorage(){try{dbReady=openDB();await dbReady;const stored=await idbGet();if(stored){S=stored;return}const legacy=localStorage.getItem('catalogos');if(legacy){try{S=JSON.parse(legacy);await idbPut(slim(S));localStorage.removeItem('catalogos')}catch(e){await idbPut(slim(S))}}else await idbPut(slim(S));try{if(navigator.storage?.persist)await navigator.storage.persist()}catch(e){}}catch(e){console.warn('IndexedDB no disponible; usando localStorage como respaldo temporal.',e)}}
function save(){clearTimeout(saveTimer);saveTimer=setTimeout(async()=>{try{if(DB)await idbPut(slim(S));else localStorage.setItem('catalogos',JSON.stringify(slim(S)));if(V.t=='sets')showStorageInfo()}catch(e){alert('No se pudo guardar. Exporta un respaldo JSON y libera espacio del dispositivo.')}},600)}
async function saveNow(){try{if(DB)await idbPut(slim(S));else localStorage.setItem('catalogos',JSON.stringify(slim(S)))}catch(e){throw e}}
async function storageInfo(){try{return await navigator.storage?.estimate?.()}catch(e){return null}}
function fmtBytes(n){if(!n)return '0 B';const u=['B','KB','MB','GB','TB'],i=Math.min(u.length-1,Math.floor(Math.log(n)/Math.log(1024)));return (n/1024**i).toFixed(i?1:0)+' '+u[i]}
const IMG_MAX=640;
const WEBP=(()=>{try{return document.createElement('canvas').toDataURL('image/webp').startsWith('data:image/webp')}catch(e){return false}})();
const enc=c=>WEBP?c.toDataURL('image/webp',.78):c.toDataURL('image/jpeg',.72);
function norm(x){(x.p||[]).forEach(p=>{if(!p.imgs?.length)p.imgs=p.img?[p.img]:[];p.img=p.imgs[0]||''});x.orders=x.orders||[];return x}
const slim=x=>({...x,p:x.p.map(({img,...r})=>r)});
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const m=n=>S.set.cur+Number(n).toFixed(2);
const price=p=>p.sale?`<s>${m(p.price)}</s> ${m(p.sale)}`:m(p.price);
const prod=id=>S.p.find(p=>p.id==id);
const TPL=[['clasica','Clásica','General'],['minimal','Minimalista','General'],['menu','Lista con fotos','General'],['price','Ofertas','General'],['color','Colorida','General'],['moderna','Moderna oscura','Tecnología'],['neon','Neon Grid','Tecnología'],['electronics','Electrónica','Tecnología'],['tech','Ficha técnica','Tecnología'],['revista','Revista','Belleza'],['botanical','Botánica','Belleza'],['rose','Rose Gold','Belleza'],['street','Streetwear','Moda'],['lujo','Lujo','Lujo'],['market','Mercado fresco','Comida']];
let V={t:'home',q:'',cat:'Todos'};
function go(t,x){Object.assign(V,{t},x||{});R(true)}
function R(top){
 $('#app').innerHTML=({home:H,prods:P,pform:PF,cats:C,cform:CF,prev:PV,sets:ST,tpl:TP,tienda:TI,orders:OR,oform:OF,quote:QT,recalc:RC})[V.t]();
 if(storageTimer){clearInterval(storageTimer);storageTimer=null} if(V.t=='sets'){showStorageInfo();storageTimer=setInterval(()=>{if(V.t=='sets')showStorageInfo();},3000)}
 $('#nav').style.display=['pform','cform','prev','tpl','oform','tienda','quote','recalc'].includes(V.t)?'none':'flex';
 document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==V.t));
 if(V.t=='tpl')fit();if(top)scrollTo(0,0)}
/* INICIO */
function H(){
 const dr=S.c.filter(c=>c.status!='pub').length;
 const rec=[...S.c].sort((a,b)=>b.date-a.date).slice(0,5);
 return `<div class=hero><small>Bienvenido</small><h1>${esc(S.set.brand)}</h1></div>
 <input class=search placeholder="Buscar productos" oninput="V.q=this.value;go('prods',{q:this.value})">
 <div class=stats><div class=stat onclick="go('prods')"><b>${S.p.length}</b><small>Productos</small></div>
 <div class=stat onclick="go('cats')"><b>${S.c.length}</b><small>Catálogos</small></div>
 <div class=stat><b style="color:var(--wr)">${dr}</b><small>Borradores</small></div></div>
 <div class=row style="margin-bottom:14px"><button class=btn2 onclick="go('orders')">🧾 Pedidos</button><button class=btn2 onclick="go('quote')">💬 Cotizar</button></div>
 ${S.p.length&&(bkDays()===null||bkDays()>=7)?`<div class=sec style="border:1.5px solid #f3bc41"><b>Respalda tus datos</b><small style="display:block;margin:4px 0 10px">${bkDays()===null?'Aún no has hecho un respaldo.':'Tu último respaldo fue hace '+bkDays()+' días.'} Tus productos viven solo en este navegador: si borras los datos de Safari o cambias de teléfono, se pierden.</small><button class=btn2 onclick="exp()">Exportar respaldo ahora</button></div>`:''}
 <h2 style="margin-bottom:10px">Editados recientemente</h2>
 ${rec.length?rec.map(c=>`<div class=sec onclick="openC('${c.id}')"><span class="pill ${c.status=='pub'?'pub':'drf'}">${c.status=='pub'?'Publicado':'Borrador'}</span><h2 style="margin-top:8px">${esc(c.title)}</h2><small>${new Date(c.date).toLocaleDateString('es-MX')} · ${c.ids.length} productos</small></div>`).join(''):'<div class=empty>Aún no tienes catálogos. Crea el primero desde la pestaña 📖.</div>'}
 <button class=fab onclick="newP()">+</button>`}
/* PRODUCTOS */
function P(){
 const q=V.q.toLowerCase();
 const l=S.p.filter(p=>(V.cat=='Todos'||p.cat==V.cat)&&(p.name+p.desc).toLowerCase().includes(q));
 return `<div class=top><h2>Productos</h2></div>
 <input class=search placeholder="Buscar" value="${esc(V.q)}" oninput="V.q=this.value;clearTimeout(V.tm);V.tm=setTimeout(()=>{R();$('.search').focus();$('.search').setSelectionRange(99,99)},250)">
 <div class=chips>${['Todos',...S.cats].map(c=>`<button class="chip ${V.cat==c?'on':''}" onclick="V.cat='${esc(c)}';R()">${esc(c)}</button>`).join('')}</div>

/* ===== Calculadora de costos y precios ===== */
const CFGD={kg:291,dep:2.92,man:0.90,ene:0.67,mult:{c1:[3.5,4.5],c2:[2.5,3.0],c2e:[3.0,3.5],c3:[2.0,2.3]}};
const CATS={c1:'Cat 1 · Impulso / accesorio (llaveros, piezas ligeras)',c2:'Cat 2 · Decorativo / figura (50 a 200 g)',c2e:'Cat 2 · Kit o ensamble por partes',c3:'Cat 3 · Gran formato (más de 300 g o 10 h)'};
function CFG(){const u=S.cfg||{};return{...CFGD,...u,mult:{...CFGD.mult,...(u.mult||{})}}}
const hrCost=c=>+(c.dep+c.man+c.ene).toFixed(2);
const r5=x=>Math.round(x/5)*5;
const fm=x=>'$'+(+x).toFixed(2);
const catSug=(g,h)=>g>300||h>10?'c3':(g>0&&g<50?'c1':'c2');
const midM=(cat)=>{const k=CFG().mult[cat]||CFG().mult.c2;return +(((k[0]+k[1])/2).toFixed(2))};
/* filamentos: el primero ("def") usa el precio por defecto; los demás se agregan en Ajustes */
const filaments=()=>[{id:'def',n:'PLA (por defecto)',kg:CFG().kg},...((S.cfg&&S.cfg.fil)||[]).map(f=>({id:f.id,n:f.n||'Filamento',kg:+f.kg||0}))];
const kgOf=id=>{const f=filaments().find(x=>x.id==id);return f?f.kg:CFG().kg};
const flRows=c=>Array.isArray(c.fl)&&c.fl.length?c.fl:[{f:'def',g:c.g}];
const gramsOf=c=>flRows(c).reduce((a,r)=>a+(+r.g||0),0);
const matOf=c=>flRows(c).reduce((a,r)=>a+(+r.g||0)*kgOf(r.f)/1000,0);
function calcOut(c){
 const g=gramsOf(c),h=(+c.h||0)+(+c.m||0)/60,z=Math.max(1,Math.round(+c.z||1));
 if(!g&&!h)return{html:'<small>Escribe los gramos y el tiempo para ver el precio sugerido.</small>',price:0};
 const cf=CFG(),mat=matOf(c),maq=h*hrCost(cf),tot=mat+maq,pz=tot/z,k=cf.mult[c.cat]||cf.mult.c2,mult=+c.mult||0;
 const lo=r5(pz*k[0]),hi=r5(pz*k[1]),price=mult?r5(pz*mult):0;
 return{price,html:`<small style="display:block;line-height:1.5">Material ${fm(mat)} + máquina ${fm(maq)} = <b>costo directo ${fm(tot)}</b>${z>1?`<br>Por pieza (${z} en la placa): <b>${fm(pz)}</b>`:''}<br>Rango sugerido (${k[0]}x a ${k[1]}x): <b>$${lo} a $${hi}</b>${price?`<br>Con ${mult}x: <b style="font-size:16px">$${price}</b> · ganancia ${fm(price-pz)}`:''}</small>`}}
const flSelHtml=(r)=>`<select class=cfs style="flex:2;min-width:0" onchange="calc()">${filaments().map(x=>`<option value="${esc(x.id)}" ${r.f==x.id?'selected':''}>${esc(x.n)} · ${fm(x.kg)}/kg</option>`).join('')}</select>`;
const flRowsHtml=c=>{const rows=flRows(c);return rows.map((r,i)=>`<div class=row style="align-items:center;margin-bottom:6px">${flSelHtml(r)}<input class=cgi type=number inputmode=decimal placeholder="Gramos" value="${esc(r.g??'')}" oninput="calc()" style="flex:1;min-width:0">${rows.length>1?`<button type=button class=ib style="flex:none;margin-bottom:10px" onclick="calcDelFl(${i})">✕</button>`:''}</div>`).join('')};
function calcUI(f){const c=f.cost||{};
 return `<details class=sec id=ccalc ${f.cost&&(c.g||c.h||(c.fl&&c.fl.length>1))?'open':''}><summary style="cursor:pointer;font-weight:700">Calculadora de costos</summary>
 <small style="display:block;margin:8px 0">Escribe lo que marca tu laminador. Los gramos son del modelo, la purga y los soportes.</small>
  <small style="display:block;margin:10px 0 6px">Filamentos usados y gramos de cada uno</small>
 <div id=cfl>${flRowsHtml(c)}</div>
 <button type=button class=btn2 onclick="calcAddFl()">+ Agregar otro filamento</button>
 <small style="display:block;margin:10px 0 6px">Tiempo de impresión</small>
 <div class=row><input id=ch type=number inputmode=numeric placeholder="Horas" value="${c.h??''}" oninput="calc()"><input id=cmin type=number inputmode=numeric placeholder="Min" value="${c.m??''}" oninput="calc()"></div>
 <div class=row style="margin-top:8px"><input id=cz type=number inputmode=numeric placeholder="Piezas en la placa (1)" value="${c.z??''}" oninput="calc()"></div>
 <select id=ccat style="margin-top:8px" onchange="calcCat()">${Object.entries(CATS).map(([k,l])=>`<option value="${k}" ${(c.cat||'c2')==k?'selected':''}>${l}</option>`).join('')}</select>
 <div class=row style="margin-top:8px;align-items:center"><span style="flex:1;font-size:13px">Multiplicador</span><input id=cm type=number step=0.05 inputmode=decimal value="${c.mult??midM(c.cat||'c2')}" oninput="calcM()"></div>
 <div id=cout style="margin:10px 0">${calcOut({...c,cat:c.cat||'c2',mult:c.mult??midM(c.cat||'c2')}).html}</div>
 <button type=button class=btn2 id=cuse onclick="useCalc()">Usar este precio</button></details>`}
const flFromDom=()=>{const s=[...document.querySelectorAll('#ccalc .cfs')],g=[...document.querySelectorAll('#ccalc .cgi')];return s.map((x,i)=>({f:x.value,g:g[i]?g[i].value:''}))};
function calc(){const c=V.f.cost=V.f.cost||{};
 c.fl=flFromDom();c.g=String(gramsOf(c)||'');c.h=$('#ch').value;c.m=$('#cmin').value;c.z=$('#cz').value;
 const z=Math.max(1,Math.round(+c.z||1));
 if(!c.manualCat)c.cat=catSug(gramsOf(c)/z,((+c.h||0)+(+c.m||0)/60)/z);
 if(!c.manualM)c.mult=midM(c.cat);
 $('#ccat').value=c.cat;$('#cm').value=c.mult;$('#cout').innerHTML=calcOut(c).html}
function calcAddFl(){const c=V.f.cost=V.f.cost||{};c.fl=flFromDom();c.fl.push({f:'def',g:''});R()}
function calcDelFl(i){const c=V.f.cost=V.f.cost||{};c.fl=flFromDom();c.fl.splice(i,1);c.g=String(gramsOf(c)||'');R()}
function calcCat(){const c=V.f.cost=V.f.cost||{};c.manualCat=true;c.cat=$('#ccat').value;if(!c.manualM){c.mult=midM(c.cat);$('#cm').value=c.mult}$('#cout').innerHTML=calcOut(c).html}
function calcM(){const c=V.f.cost=V.f.cost||{};c.manualM=true;c.mult=+$('#cm').value||0;c.cat=c.cat||$('#ccat').value;$('#cout').innerHTML=calcOut(c).html}
function useCalc(){const c=V.f.cost||{},o=calcOut({...c,cat:c.cat||'c2'});if(!o.price)return;V.f.price=o.price;$('#fprice').value=o.price;const e=$('#cuse');e.textContent='Precio puesto ✓';setTimeout(()=>{e.textContent='Usar este precio'},1500)}
function setCfg(k,v,sub){S.cfg=S.cfg||{};if(sub){S.cfg.mult=S.cfg.mult||{};S.cfg.mult[sub[0]]=S.cfg.mult[sub[0]]||[...CFGD.mult[sub[0]]];S.cfg.mult[sub[0]][sub[1]]=+v||0}else S.cfg[k]=+v||0;save();const e=$('#cfgHr');if(e)e.textContent=fm(hrCost(CFG()))}
function filAdd(){S.cfg=S.cfg||{};S.cfg.fil=S.cfg.fil||[];S.cfg.fil.push({id:uid(),n:'',kg:''});save();R()}
function filSet(i,k,v){S.cfg.fil[i][k]=v;save()}
function filDel(i){if(!confirm('¿Quitar este filamento? Los productos que lo usan se calcularán con el precio por defecto.'))return;S.cfg.fil.splice(i,1);save();R()}
function costUI(){const c=CFG(),m=c.mult,inp=(k,l,v)=>`<div style="flex:1"><small>${l}</small><input type=number step=0.01 inputmode=decimal value="${v}" oninput="setCfg('${k}',this.value)"></div>`;
 const mr=(k,l)=>`<div class=row style="align-items:center;margin-top:6px"><span style="flex:1.6;font-size:13px">${l}</span><input type=number step=0.1 inputmode=decimal value="${m[k][0]}" oninput="setCfg('',this.value,['${k}',0])"><input type=number step=0.1 inputmode=decimal value="${m[k][1]}" oninput="setCfg('',this.value,['${k}',1])"></div>`;
 const fl=(S.cfg&&S.cfg.fil)||[];
 return `<div class=sec><b>Costos y precios</b><small style="display:block;margin:4px 0 8px;line-height:1.4">Los usa la calculadora de costos de cada producto. Son datos privados: no salen en tu catálogo web.</small>
 <div class=row>${inp('kg','PLA por defecto $/kg',c.kg)}${inp('dep','Depreciación $/h',c.dep)}</div>
 <div class=row style="margin-top:6px">${inp('man','Mantenimiento $/h',c.man)}${inp('ene','Energía $/h',c.ene)}</div>
 <small style="display:block;margin:8px 0">Tarifa por hora de máquina: <b id=cfgHr>${fm(hrCost(c))}</b></small>
 <small>Otros filamentos (nombre y precio por kilo)</small>
 ${fl.map((f,i)=>`<div class=row style="align-items:center;margin-top:6px"><input placeholder="Nombre (ej. PETG negro)" value="${esc(f.n)}" oninput="filSet(${i},'n',this.value)" style="flex:2"><input type=number inputmode=decimal placeholder="$/kg" value="${esc(f.kg)}" oninput="filSet(${i},'kg',this.value)" style="flex:1"><button class=ib style="flex:none;margin-bottom:10px" onclick="filDel(${i})">✕</button></div>`).join('')}
 <button class=btn2 style="margin:6px 0 10px" onclick="filAdd()">+ Agregar filamento</button>
 <small>Multiplicadores (mínimo y máximo)</small>
 ${mr('c1','Cat 1 · Accesorios')}${mr('c2','Cat 2 · Decorativo')}${mr('c2e','Cat 2 · Ensamble')}${mr('c3','Cat 3 · Gran formato')}</div>`}

const STATES=['Pendiente','Imprimiendo','Listo','Entregado','Cancelado'];
const todayStr=()=>new Date().toISOString().slice(0,10);
function costCalc(c){const g=gramsOf(c),h=(+c.h||0)+(+c.m||0)/60,z=Math.max(1,Math.round(+c.z||1));
 const cf=CFG(),mat=matOf(c),maq=h*hrCost(cf),tot=mat+maq,pz=tot/z;
 const cat=c.cat||catSug(g/z,h/z),k=cf.mult[cat]||cf.mult.c2,mult=c.manualM&&+c.mult?+c.mult:midM(cat);
 return{g,h,z,mat,maq,tot,pz,cat,k,mult,price:r5(pz*mult)}}
const costPz=p=>{const c=p.cost;return c&&(+c.g||+c.h)?+costCalc(c).pz.toFixed(2):''};
const fmt=x=>S.set.cur+(+x).toFixed(Math.abs(x%1)>0.004?2:0);
/* ---- Mi tienda web ---- */
function shopS(){S.shop=S.shop||{};const s=S.shop;s.faq=s.faq||[];s.descuentos=s.descuentos||[];s.cupones=s.cupones||[];return s}
function setShop(k,v){shopS()[k]=v;save()}
function shopSet(k,i,f,v){shopS()[k][i][f]=v;save()}
function shopAdd(k){shopS()[k].push(k=='faq'?{q:'',a:''}:k=='descuentos'?{min:'',pct:''}:{code:'',tipo:'pct',val:'',min:'',vence:''});save();R()}
function shopDel(k,i){shopS()[k].splice(i,1);save();R()}
function shopOut(){const s=S.shop||{},o={};
 ['tiempo','envios','pagos','about','instagram','goatcounter'].forEach(k=>{const v=String(s[k]||'').trim();if(v)o[k]=k=='instagram'?v.replace(/^@/,''):v});
 const ent=String(s.entrega||'').split(',').map(x=>x.trim()).filter(Boolean);if(ent.length)o.entrega=ent;
 const fq=(s.faq||[]).filter(f=>f.q&&f.q.trim()&&f.a&&f.a.trim()).map(f=>[f.q.trim(),f.a.trim()]);if(fq.length)o.faq=fq;
 const ds=(s.descuentos||[]).map(d=>({min:Math.round(+d.min),pct:+d.pct})).filter(d=>d.min>0&&d.pct>0&&d.pct<100);if(ds.length)o.descuentos=ds;
 const cp={};(s.cupones||[]).forEach(c=>{const code=String(c.code||'').trim().toUpperCase(),v=+c.val;if(!code||!(v>0))return;const e=c.tipo=='monto'?{monto:v}:{pct:Math.min(v,99)};if(+c.min>0)e.min=+c.min;if(c.vence)e.vence=c.vence;cp[code]=e});
 if(Object.keys(cp).length)o.cupones=cp;
 if(S.theme&&Object.keys(S.theme).length)o.colores={...THEME0,...S.theme};
 return o}
function TI(){const s=shopS(),inp=(k,ph)=>`<input placeholder="${ph}" value="${esc(s[k]||'')}" oninput="setShop('${k}',this.value)">`;
 return `<div class=top><button class=ib onclick="go('sets')">‹</button><h2>Mi tienda web</h2></div>
 <small style="display:block;margin-bottom:12px;line-height:1.4">Lo que escribas aquí se publica junto con tu catálogo. Lo que dejes vacío usa lo que ya trae la página. Para que tus clientes lo vean, toca Publicar en la web en Ajustes.</small>
 <div class=sec><b>Datos para tus clientes</b>
  ${inp('tiempo','Tiempo de producción (ej. 2 a 5 días hábiles)')}${inp('envios','Envíos (ej. A todo México por paquetería)')}${inp('pagos','Formas de pago (ej. Transferencia o efectivo)')}
  ${inp('entrega','Opciones de entrega, separadas por coma (ej. Envío, Recoger en persona)')}${inp('instagram','Instagram, sin @ (ej. 12_tresd)')}</div>
 <div class=sec><b>Quiénes somos</b><textarea rows=4 placeholder="Cuenta tu historia. Una línea nueva separa los párrafos." oninput="setShop('about',this.value)">${esc(s.about||'')}</textarea></div>
 <div class=sec><b>Preguntas frecuentes</b>${s.faq.map((f,i)=>`<div style="border-top:1px solid var(--bd);padding-top:10px;margin-top:10px"><input placeholder="Pregunta" value="${esc(f.q)}" oninput="shopSet('faq',${i},'q',this.value)"><textarea rows=2 placeholder="Respuesta" oninput="shopSet('faq',${i},'a',this.value)">${esc(f.a)}</textarea><button class=btn2 onclick="shopDel('faq',${i})">Quitar</button></div>`).join('')}
  <button class=btn2 style="margin-top:10px" onclick="shopAdd('faq')">+ Agregar pregunta</button><small style="display:block;margin-top:6px">Si no agregas ninguna, la página usa las preguntas que ya trae.</small></div>

function quoteCalc(t){const q=Math.max(1,Math.round(+t.q||1)),c=costCalc({g:t.g,h:t.h,m:t.m,z:1,fl:[{f:t.fil||'def',g:t.g}],cat:t.manualCat?t.cat:undefined,manualM:t.manualM,mult:t.mult});
 const unit=r5(c.pz*c.mult),sub=unit*q,dis=+t.dis||0,env=+t.env||0,total=sub+dis+env,costT=c.tot*q;
 return{q,c,unit,sub,dis,env,total,costT,gan:total-env-costT}}

const loadImg=src=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=src});
function rrp(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function wrapLines(g,t,maxW,maxL){const w=String(t).split(/\s+/),L=[];let c='';for(const x of w){const n=c?c+' '+x:x;if(g.measureText(n).width>maxW&&c){L.push(c);c=x}else c=n}if(c)L.push(c);
 if(L.length>maxL){L.length=maxL;let l=L[maxL-1];while(l.length>1&&g.measureText(l+'…').width>maxW)l=l.slice(0,-1);L[maxL-1]=l+'…'}return L}
async function shareImg(){const f=V.f;if(!f.imgs?.length)return alert('Agrega una foto del producto primero.');
 busy('Creando imagen…');
 try{
  const W=1080,H=1350,c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
  g.fillStyle='#1A1D23';g.fillRect(0,0,W,H);
  const im=await loadImg(f.imgs[0]),s=960;
  g.save();rrp(g,60,60,s,s,48);g.clip();const k=Math.max(s/im.width,s/im.height),w=im.width*k,h=im.height*k;g.drawImage(im,60+(s-w)/2,60+(s-h)/2,w,h);g.restore();
  const tag=f.out?'AGOTADO':f.sale?'OFERTA':(f.nuevo&&Date.now()-f.nuevo<30*864e5?'NUEVO':'');
  if(tag){g.font='800 40px system-ui,-apple-system,sans-serif';const tw=g.measureText(tag).width+56;g.fillStyle=f.out?'#667085':tag=='NUEVO'?'#469DB0':'#F3BC41';rrp(g,92,92,tw,72,36);g.fill();g.fillStyle=f.out||tag=='NUEVO'?'#fff':'#1A1D23';g.textAlign='left';g.fillText(tag,120,144)}
  g.textAlign='left';g.fillStyle='#fff';g.font='700 54px system-ui,-apple-system,sans-serif';
  wrapLines(g,f.name||'',650,2).forEach((l,i)=>g.fillText(l,60,1115+i*60));
  const cur=S.set.cur,fp=x=>cur+(+x).toFixed(Math.abs(x%1)>0.004?2:0);
  g.fillStyle='#F3BC41';g.font='800 84px system-ui,-apple-system,sans-serif';g.fillText(fp(f.sale||f.price),60,1262);
  if(f.sale){const px=60+g.measureText(fp(f.sale)).width+24;g.fillStyle='#9AA3B2';g.font='500 40px system-ui,-apple-system,sans-serif';const o=fp(f.price);g.fillText(o,px,1260);g.fillRect(px,1245,g.measureText(o).width,3)}
  g.fillStyle='#CBD2DF';g.font='500 30px system-ui,-apple-system,sans-serif';g.fillText('Pídelo por WhatsApp'+((S.shop&&S.shop.instagram)?' · @'+String(S.shop.instagram).replace(/^@/,''):''),60,1316);
  try{const lg=await loadImg(LOGO_IMG);g.fillStyle='#fff';rrp(g,750,1075,270,230,30);g.fill();const lh=190,lw=lg.width*lh/lg.height;g.drawImage(lg,885-Math.min(lw,250)/2,1095,Math.min(lw,250),lh*Math.min(lw,250)/lw)}catch(e){}
  const blob=await new Promise(r=>c.toBlob(r,'image/png'));busy();
  const file=new File([blob],'producto.png',{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:f.name})}catch(e){}}
  else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='producto.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
 }catch(e){busy();alert('No se pudo crear la imagen.')}}
const shareSec=f=>f.id&&f.imgs&&f.imgs.length?`<div class=sec><b>Compartir</b><button class=btn2 onclick="shareImg()">Crear imagen para redes</button><small style="display:block;margin-top:6px">Crea una imagen con la foto, el precio y tu logo, lista para Instagram o para estados de WhatsApp.</small></div>`:'';

 ${ghUI()}
 <div class=sec><b>Catálogo web (manual)</b><small>Si prefieres subir los archivos tú, genera catalogo.json (textos y precios) y fotos.json (fotos) solo con tus catálogos publicados. Si el navegador pregunta, permite descargar varios archivos.</small><button class=btn2 style="margin-top:8px" onclick="expWeb()">Exportar para la web</button><div class=row style="margin-top:8px"><a class=btn2 href="./" target="_blank" style="text-align:center;text-decoration:none">Ver mi catálogo web</a><a class=btn2 href="qr.html" target="_blank" style="text-align:center;text-decoration:none">Código QR</a></div></div>`}
async function compactDB(){
 try{await saveNow();const data=slim(S);if(!DB)return false;DB.close();
  await new Promise((ok,no)=>{const r=indexedDB.deleteDatabase('123D_Catalogo_Local');r.onsuccess=ok;r.onerror=()=>no(r.error);r.onblocked=()=>no(new Error('blocked'))});
  await openDB();await idbPut(data);return true
 }catch(e){try{await openDB();await idbPut(slim(S))}catch(_){}return false}}
async function optimize(btn){
 const all=S.p.flatMap(p=>p.imgs),before=all.reduce((a,x)=>a+x.length,0),cache=new Map(),msg=t=>{const e=$('#optMsg');if(e)e.innerHTML='<small>'+t+'</small>'};
 const shrink=src=>new Promise(ok=>{const im=new Image();im.onload=()=>{const k=Math.min(1,IMG_MAX/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);const o=enc(c);ok(o.length<src.length*.85?o:src)};im.onerror=()=>ok(src);im.src=src});
 btn.disabled=true;let n=0;
 try{
  for(const p of S.p){for(let i=0;i<p.imgs.length;i++){const x=p.imgs[i];if(!cache.has(x))cache.set(x,await shrink(x));p.imgs[i]=cache.get(x);msg('Optimizando '+(++n)+' de '+all.length+'…')}p.img=p.imgs[0]||''}
  msg('Compactando almacenamiento…');const okc=await compactDB();
  const after=S.p.flatMap(p=>p.imgs).reduce((a,x)=>a+x.length,0);
  msg('Antes: '+fmtBytes(before)+' → Ahora: '+fmtBytes(after)+(before?' (−'+Math.round(100*(1-after/before))+'%)':'')+(okc?'. Almacenamiento compactado.':'. No se pudo compactar; cierra otras pestañas e inténtalo otra vez.'));setTimeout(showStorageInfo,800);
 }catch(e){msg('No se pudo optimizar. Exporta un respaldo e inténtalo de nuevo.')}
 btn.disabled=false}
function renCat(i){
 const old=S.cats[i],n=(prompt('Nuevo nombre para "'+old+'"',old)||'').trim();
 if(!n||n==old)return;
 const j=S.cats.findIndex((c,k)=>k!=i&&c.toLowerCase()==n.toLowerCase());
 if(j>=0){
  if(!confirm('Ya existe "'+S.cats[j]+'". ¿Unir las dos categorías? Los productos pasarán a "'+S.cats[j]+'".'))return;
  S.p.forEach(p=>{if(p.cat==old)p.cat=S.cats[j]});if(V.cat==old)V.cat=S.cats[j];S.cats.splice(i,1)
 }else{S.cats[i]=n;S.p.forEach(p=>{if(p.cat==old)p.cat=n});if(V.cat==old)V.cat=n}
 save();R()}
function delCat(i){
 const c=S.cats[i],rest=S.cats.filter((_,j)=>j!=i),n=S.p.filter(p=>p.cat==c).length;
 if(!rest.length)return alert('Debe quedar al menos una categoría.');
 if(!confirm(n?n+' producto(s) usan "'+c+'" y pasarán a "'+rest[0]+'". ¿Quitar la categoría?':'¿Quitar la categoría "'+c+'"?'))return;
 S.p.forEach(p=>{if(p.cat==c)p.cat=rest[0]});if(V.cat==c)V.cat='Todos';S.cats.splice(i,1);save();R()}
function togCat(id,on){const a=V.f._c,i=a.indexOf(id);if(on&&i<0)a.push(id);if(!on&&i>=0)a.splice(i,1)}
async function showStorageInfo(){const el=$('#storageInfo');if(!el)return;const x=await storageInfo();if(!x||!x.quota){el.innerHTML='<small>Este navegador no permite consultar el espacio disponible.</small>';return}const used=x.usage||0,quota=x.quota||0,free=Math.max(0,quota-used),pct=Math.min(100,(used/quota)*100),cls=pct>=90?'danger':pct>=75?'warn':'';el.innerHTML=`<div class=storageTop><b>${fmtBytes(used)} usados</b><small>${fmtBytes(free)} disponibles aprox.</small></div><div class=storageMeter><div class=storageTrack><div class="storageFill ${cls}" style="width:${pct.toFixed(1)}%"></div></div></div><div class=storageMeta><small>${pct.toFixed(1)}% utilizado</small><small>Límite estimado: ${fmtBytes(quota)}</small></div>`}
function bkDays(){const t=+localStorage.getItem('lastBackup');return t?Math.floor((Date.now()-t)/864e5):null}
/* ===== Publicar en la web (GitHub) ===== */
let GHT=null;
const GH_POLL=6000;
function buildWeb(){
 const cs=S.c.filter(c=>c.status=='pub');if(!cs.length){alert('Primero publica al menos un catálogo (botón Publicar).');return null}
 const ids=new Set(cs.flatMap(c=>c.ids)),ps=S.p.filter(p=>ids.has(p.id)),f={};
 ps.forEach(p=>{f[p.id]=p.imgs?.length?p.imgs:(p.img?[p.img]:[])});
 const v=Date.now();
 return{out:{v,set:S.set,shop:shopOut(),c:cs.map(({id,title,ids,ac,date})=>({id,title,ids,ac,date})),p:ps.map(({img,imgs,cost,...r})=>({...r,n:(imgs?.length)||1}))},fotos:{v,f}}}
function expWeb(){
 const w=buildWeb();if(!w)return;
 const dl=(name,obj)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(obj)],{type:'application/json'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};
 dl('catalogo.json',w.out);setTimeout(()=>dl('fotos.json',w.fotos),700)}
const b64=u=>btoa(String.fromCharCode(...u));
const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function gkey(pw,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encTok(tok,pw){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await gkey(pw,salt),new TextEncoder().encode(tok)));return{s:b64(salt),i:b64(iv),c:b64(ct)}}
async function decTok(o,pw){return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(o.i)},await gkey(pw,ub(o.s)),ub(o.c)))}
const toB64=s=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result.split(',')[1]);r.onerror=no;r.readAsDataURL(new Blob([s]))});
function ghConn(){try{return JSON.parse(localStorage.getItem('ghConn')||'null')}catch(e){return null}}
function ghInfer(){const h=location.hostname;if(!h.endsWith('.github.io'))return'';const r=location.pathname.split('/')[1];return h.split('.')[0]+'/'+(r&&!r.endsWith('.html')?r:h)}
const ghBase=()=>location.origin+location.pathname.replace(/[^/]*$/,'');
function ghMsg(t,html){const e=$('#pubMsg');if(e)e.innerHTML='<small style="display:block;line-height:1.4">'+(html?t:esc(t))+'</small>'}
function ghErr(s,j){const m=j&&j.message?j.message:'';
 if(s==401)return'La llave no es válida o ya venció. Crea una nueva y vuelve a conectar.';
 if(s==403)return'GitHub rechazó el permiso. Revisa que la llave tenga "Contents: Read and write" en este repositorio.'+(m?' ('+m+')':'');
 if(s==404)return'No encuentro ese repositorio con esa llave. Revisa el nombre y que la llave tenga acceso a él.';
 return'GitHub respondió '+s+(m?': '+m:'')}
async function ghApi(path,opt,tok){
 try{return await fetch('https://api.github.com'+path,{...opt,headers:{Authorization:'Bearer '+tok,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}})}
 catch(e){throw new Error('No se pudo conectar con GitHub. Revisa tu internet.')}}
async function ghList(c,tok){
 const r=await ghApi('/repos/'+c.repo+'/contents?ref='+encodeURIComponent(c.branch),{},tok);
 const j=await r.json().catch(()=>({}));if(!r.ok){if(r.status==401)GHT=null;throw new Error(ghErr(r.status,j))}
 const m={};(Array.isArray(j)?j:[]).forEach(f=>{m[f.name]=f.sha});return m}
async function ghPut(c,name,b64s,tok,shas,retry=1){
 const body={message:'Actualiza '+name+' desde la app',content:b64s,branch:c.branch};if(shas[name])body.sha=shas[name];
 const r=await ghApi('/repos/'+c.repo+'/contents/'+name,{method:'PUT',body:JSON.stringify(body)},tok);
 if(r.ok)return;
 const j=await r.json().catch(()=>({}));
 if((r.status==409||r.status==422)&&retry>0){Object.assign(shas,await ghList(c,tok));return ghPut(c,name,b64s,tok,shas,retry-1)}
 if(r.status==401)GHT=null;
 throw new Error(ghErr(r.status,j))}
async function ghSave(btn){
 const repo=$('#ghRepo').value.trim().replace(/^https?:\/\/github\.com\//,'').replace(/\/$/,''),tok=$('#ghTok').value.trim(),useKey=!!(($('#ghUseKey')||{}).checked);
 const pw=useKey?$('#ghPw').value.trim().normalize('NFC'):'',pw2=useKey?(($('#ghPw2')||{}).value||'').trim().normalize('NFC'):'';
 if(!/^[\w.-]+\/[\w.-]+$/.test(repo))return ghMsg('Escribe el repositorio como usuario/repositorio.');
 if(!tok)return ghMsg('Pega tu llave de GitHub.');
 if(useKey){if(pw!==pw2)return ghMsg('Las dos claves no son iguales. Toca "Ver la clave" para revisarlas.');if(pw.length<4)return ghMsg('Tu clave debe tener al menos 4 caracteres.')}
 btn.disabled=true;ghMsg('Comprobando conexión…');
 try{
  const r=await ghApi('/repos/'+repo,{},tok),j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(ghErr(r.status,j));
  if(j.permissions&&j.permissions.push===false)throw new Error('Esa llave no tiene permiso de escritura en el repositorio.');
  const conn={repo,branch:j.default_branch||'main'};if(useKey)conn.enc=await encTok(tok,pw);else conn.tok=tok;
  localStorage.setItem('ghConn',JSON.stringify(conn));
  GHT=tok;R()
 }catch(e){ghMsg(e.message||'No se pudo conectar.');btn.disabled=false}}
async function ghPickup(){
 const cs=S.c.filter(c=>c.status=='pub');if(!cs.length)return;
 const inCat=new Set(S.c.flatMap(c=>c.ids)),miss=S.p.filter(p=>!inCat.has(p.id));
 if(!miss.length)return;
 const names=miss.slice(0,5).map(p=>p.name).join(', ')+(miss.length>5?'…':'');
 if(confirm('Hay '+miss.length+' producto(s) que no están en ningún catálogo ('+names+').\n\nAceptar = agregarlos al catálogo "'+cs[0].title+'" y publicar.\nCancelar = publicar sin ellos.')){cs[0].ids.push(...miss.map(p=>p.id));await saveNow()}}
async function ghWait(v,say=ghMsg){
 for(let i=0;i<30;i++){
  await new Promise(r=>setTimeout(r,GH_POLL));
  try{const r=await fetch(ghBase()+'catalogo.json?nc='+Date.now(),{cache:'no-store'});if(r.ok){const j=await r.json();if(j.v===v)return true}}catch(e){}
  say('Subido a GitHub ✓ Esperando a que la web se actualice… ('+Math.round((i+1)*GH_POLL/1000)+' s)')}
 return false}
async function ghUnlock(raw){const c=ghConn();if(!raw||!raw.trim())throw new Error('Escribe tu clave.');
 const t=raw.trim();
 for(const pw of [...new Set([t.normalize('NFC'),t,raw,t.normalize('NFD')])]){try{GHT=await decTok(c.enc,pw);return}catch(e){}}
 throw new Error('Clave incorrecta. Revisa mayúsculas y espacios. Si no la recuerdas, ve a Ajustes, toca "Quitar conexión" y conéctate de nuevo; esta vez puedes dejarla sin clave.')}
async function ghSend(say){
 await ghPickup();
 const w=buildWeb();if(!w)return{none:true};
 const c=ghConn();say('Revisando tu repositorio…');
 const shas=await ghList(c,GHT);
 for(const [name,obj,lab] of [['fotos.json',w.fotos,'fotos'],['catalogo.json',w.out,'catálogo']]){say('Subiendo '+lab+'…');await ghPut(c,name,await toB64(JSON.stringify(obj)),GHT,shas)}
 try{localStorage.setItem('lastPub',Date.now())}catch(_){}
 say('Subido a GitHub ✓ Esperando a que la web se actualice…');
 return{ok:await ghWait(w.out.v,say),n:w.out.p.length}}
async function ghPublish(btn){
 const c=ghConn();if(!c)return;
 btn.disabled=true;
 try{
  if(!GHT&&c.tok)GHT=c.tok;
  if(!GHT){ghMsg('Abriendo tu llave…');await ghUnlock(($('#ghPw')||{}).value||'')}
  const r=await ghSend(ghMsg),lk=' <a href="'+esc(ghBase())+'" target="_blank" style="color:var(--pri)">Ver mi catálogo</a>';
  if(!r.none)ghMsg(r.ok?'Ya está en línea ✓ ('+r.n+' productos).'+lk:'Se subió a GitHub, pero la web tarda más de lo normal en actualizarse. Espera unos minutos y recarga tu catálogo.'+lk,true)
 }catch(e){ghMsg(e.message||'No se pudo publicar.')}
 btn.disabled=false}
async function saveAndPublish(){
 if(!saveP())return;
 await saveNow();
 const c=ghConn();if(!c)return alert('Primero conecta GitHub en Ajustes, en Publicar en la web.');
 try{
  if(!GHT&&c.tok)GHT=c.tok;
  if(!GHT){const raw=prompt('Escribe tu clave para publicar en la web');if(!raw){busy('Guardado. No se publicó.');setTimeout(busy,1800);return}busy('Abriendo tu llave…');await ghUnlock(raw)}
  const r=await ghSend(busy);
  if(r.none){busy();return}
  busy(r.ok?'Ya está en línea ✓':'Subido. La web tarda más de lo normal en actualizarse.');setTimeout(busy,2600)
 }catch(e){busy();alert(e.message||'No se pudo publicar.')}}
function ghEye(on){document.querySelectorAll('input.pw').forEach(i=>i.style.webkitTextSecurity=on?'none':'disc')}
function ghDisconnect(){if(!confirm('¿Quitar la conexión con GitHub de este navegador?'))return;try{localStorage.removeItem('ghConn')}catch(_){}GHT=null;R()}
function ghKeyToggle(on){$('#ghKeyBox').style.display=on?'block':'none'}
async function ghNoKey(){const c=ghConn();if(!c||!c.enc)return;

function ghUI(){const c=ghConn();
 if(!c)return`<div class=sec><b>Publicar en la web</b><small>Sube tu catálogo a GitHub con un toque, sin subir archivos a mano. Se configura una sola vez.</small>
 <small style="display:block;margin:8px 0;line-height:1.45">1. Crea tu llave en <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" style="color:var(--sec)">github.com/settings/personal-access-tokens/new</a>. En "Repository access" elige solo tu repositorio, y en "Permissions → Repository permissions → Contents" elige "Read and write".<br>2. Pega la llave aquí abajo. Queda guardada en este teléfono y ya no te la vuelve a pedir.</small>
 <input id=ghRepo placeholder="usuario/repositorio" value="${esc(ghInfer())}" autocapitalize=off autocomplete=off>
 <input id=ghTok type=password placeholder="Llave de GitHub (empieza con github_pat_)" autocomplete=off>
 <label class=li style="border:0;padding:6px 0"><div>Protegerla con una clave<br><small>Opcional. Te la pedirá cada vez que publiques.</small></div><input type=checkbox id=ghUseKey onchange="ghKeyToggle(this.checked)"></label>
 <div id=ghKeyBox style="display:none"><input id=ghPw class=pw placeholder="Clave para protegerla" autocomplete=off autocapitalize=off autocorrect=off spellcheck=false><input id=ghPw2 class=pw placeholder="Repite la clave" autocomplete=off autocapitalize=off autocorrect=off spellcheck=false>
 <label class=li style="border:0;padding:6px 0"><div>Ver la clave al escribirla</div><input type=checkbox onchange="ghEye(this.checked)"></label></div>
 <button class=btn2 onclick="ghSave(this)">Guardar conexión</button><div id=pubMsg style="margin-top:8px"></div></div>`;
 let lp=0;try{lp=+localStorage.getItem('lastPub')}catch(_){}
 const pc=S.c.filter(x=>x.status=='pub'),inC=new Set(pc.flatMap(x=>x.ids)),inAny=new Set(S.c.flatMap(x=>x.ids)),miss=S.p.filter(p=>!inAny.has(p.id)).length;
 const st=!pc.length?'Ningún catálogo está publicado: no se subirá nada.':'En la web irán '+inC.size+' de '+S.p.length+' productos'+(miss?' ('+miss+' no están en ningún catálogo; al publicar te preguntaré si los agrego)':'')+'.';
 return`<div class=sec><b>Publicar en la web</b><small>Conectado a ${esc(c.repo)}. ${lp?'Última publicación: '+new Date(lp).toLocaleString('es-MX'):'Aún no has publicado desde aquí.'}</small>
 <small style="display:block;margin-top:6px">${esc(st)}</small>
 ${GHT||c.tok?'':'<input id=ghPw class=pw placeholder="Tu clave" autocomplete=off autocapitalize=off autocorrect=off spellcheck=false style="margin-top:8px"><label class=li style="border:0;padding:6px 0"><div>Ver la clave al escribirla</div><input type=checkbox onchange="ghEye(this.checked)"></label>'}
 <button class=btn style="margin-top:8px" onclick="ghPublish(this)">Publicar en la web ahora</button><div id=pubMsg style="margin-top:8px"></div>
 ${c.enc?'<button class=btn2 style="margin-top:8px" onclick="ghNoKey()">Dejar de pedir clave</button>':''}
 <button class=btn2 style="margin-top:8px" onclick="ghDisconnect()">Quitar conexión</button></div>`}
async function exp(){try{await saveNow();const blob=new Blob([JSON.stringify(slim(S))],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='123D-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();try{localStorage.setItem('lastBackup',Date.now())}catch(_){}setTimeout(()=>{URL.revokeObjectURL(a.href);R()},1000)}catch(e){alert('No se pudo crear el respaldo JSON.')}}

(async()=>{await initStorage();norm(S);applyTheme();try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}R();})();
